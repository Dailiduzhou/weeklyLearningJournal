<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的信息</title>
  <style>
    :root {
      --bg: #f5f6fb; --card: #fff; --ink: #1f2430; --muted: #6b7280; --line: #e5e7eb;
      --brand: #3b5bdb; --ok: #0f766e; --ok-bg: #ecfdf5; --err: #b91c1c; --err-bg: #fef2f2;
      --code-bg: #0f172a; --code-ink: #e2e8f0;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.6;
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    code { font-family: var(--mono); font-size: .9em; background: #eef1f8; padding: 1px 5px; border-radius: 4px; }
    .top { background: linear-gradient(135deg, #24306e, #3b5bdb); color: #fff; padding: 22px 0; }
    .top h1 { margin: 0 0 4px; font-size: 22px; }
    .top p { margin: 0; opacity: .85; font-size: 13.5px; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 0 20px; }
    main.wrap { padding-top: 22px; padding-bottom: 60px; display: grid; gap: 18px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px;
      box-shadow: 0 1px 2px rgba(16,24,40,.04); }
    .card h2 { margin: 0 0 12px; font-size: 16px; }
    .kv { display: grid; grid-template-columns: 120px 1fr; gap: 4px 14px; font-size: 14px; }
    .kv dt { color: var(--muted); font-size: 13px; }
    .kv dd { margin: 0; font-family: var(--mono); }
    .session { border-radius: 10px; padding: 12px 14px; font-size: 13.5px; background: var(--ok-bg);
      border: 1px solid #a7f3d0; color: #0b5f59; }
    .session strong { display: block; margin-bottom: 4px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .btn { appearance: none; border: 1px solid var(--brand); background: var(--brand); color: #fff; padding: 8px 15px;
      border-radius: 8px; font-size: 13.5px; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn.ghost { background: #fff; color: var(--brand); }
    .btn.warn { background: #fff; color: var(--err); border-color: #f3b4b4; }
    pre { margin: 12px 0 0; background: var(--code-bg); color: var(--code-ink); border-radius: 8px; padding: 12px 14px;
      font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; word-break: break-all; max-height: 260px; overflow: auto; }
    .note { font-size: 12.5px; color: var(--muted); margin-top: 10px; }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1>我的信息</h1>
      <p>GET <code>/api/users/me</code> · 通过会话 Cookie 中的 <code>username</code> 识别身份</p>
    </div>
  </header>

  <main class="wrap">
    <section class="card">
      <h2>会话状态</h2>
      <div class="session">
        <strong>已登录</strong>
        服务端从 <code>session.get("username")</code> 读到当前用户；如果这个 Cookie 丢失，本页会 302 重定向到 <code>/api/users/login</code>。
      </div>
      <dl class="kv" style="margin-top:16px">
        <dt>username</dt><dd>{{ username }}</dd>
        <dt>name</dt><dd>{{ name }}</dd>
      </dl>
      <div class="actions">
        <a class="btn ghost" href="/api/users/profiles">修改资料（PUT）</a>
        <a class="btn ghost" href="/api/users/password">修改密码（PUT）</a>
        <a class="btn ghost" href="/api/admin/users">用户列表（仅 admin）</a>
        <button class="btn warn" type="button" id="logoutBtn">登出 POST /api/users/logout</button>
      </div>
      <pre id="resBody" style="display:none"></pre>
      <div class="note">登出会调用 <code>session.purge()</code> 清空会话；成功后<strong>不自动跳转</strong>，可手动回到登录页。</div>
    </section>
  </main>

  <script>
    (function () {
      "use strict";
      var btn = document.getElementById("logoutBtn");
      var out = document.getElementById("resBody");
      btn.addEventListener("click", function () {
        fetch("/api/users/logout", { method: "POST", credentials: "same-origin" })
          .then(function (res) { return res.text(); })
          .then(function (text) {
            out.style.display = "";
            try { out.textContent = JSON.stringify(JSON.parse(text), null, 2); }
            catch (e) { out.textContent = text; }
            btn.textContent = "已登出（页面未跳转）";
            btn.disabled = true;
          })
          .catch(function (err) { out.style.display = ""; out.textContent = String(err); });
      });
    })();
  </script>
</body>
</html>
