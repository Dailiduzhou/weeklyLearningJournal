basePath: /api
host: localhost:8080
info:
  contact: {}
  description: 这是一个基于Gin+GORM的用户管理系统API文档，包含用户注册、登录、信息管理等功能。
  title: Gin用户管理API
  version: "1.0"
paths:
  /users:
    get:
      description: 返回用户注册的HTML表单页面
      produces:
      - text/html
      responses:
        "200":
          description: 返回 register.html 页面
          schema:
            type: string
      summary: 用户注册页面
      tags:
      - pages
    post:
      consumes:
      - multipart/form-data
      description: 通过表单提交用户名、密码和姓名来创建新用户
      parameters:
      - description: 用户名
        in: formData
        name: username
        required: true
        type: string
      - description: 密码
        in: formData
        name: password
        required: true
        type: string
      - description: 真实姓名
        in: formData
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: 创建成功，返回用户信息
          schema:
            additionalProperties:
              additionalProperties:
                type: string
              type: object
            type: object
        "400":
          description: 请求参数错误（如字段为空）
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器内部错误（如数据库操作失败）
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 创建新用户 (注册)
      tags:
      - users
  /users/login:
    get:
      description: 返回用户登录的HTML表单页面
      produces:
      - text/html
      responses:
        "200":
          description: 返回 login.html 页面
          schema:
            type: string
      summary: 用户登录页面
      tags:
      - pages
    post:
      consumes:
      - multipart/form-data
      description: 使用用户名和密码登录，成功后在Cookie中设置Session
      parameters:
      - description: 用户名
        in: formData
        name: username
        required: true
        type: string
      - description: 密码
        in: formData
        name: password
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功，返回用户基本信息
          schema:
            additionalProperties:
              additionalProperties:
                type: string
              type: object
            type: object
        "400":
          description: 请求参数错误
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 密码错误
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 用户不存在
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器内部错误
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 用户登录
      tags:
      - auth
  /users/logout:
    post:
      description: 清除当前用户的Session会话信息
      produces:
      - application/json
      responses:
        "200":
          description: 登出成功
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器内部错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionAuth: []
      summary: 用户登出
      tags:
      - auth
  /users/me:
    get:
      description: 验证Session后返回用户个人信息页面。若未登录则重定向到登录页。
      produces:
      - text/html
      responses:
        "200":
          description: 返回 profiles.html 页面
          schema:
            type: string
        "302":
          description: 重定向到 /api/users/login (未登录时)
          schema:
            type: string
      summary: 获取当前登录用户信息页面 (需登录)
      tags:
      - users
  /users/password:
    get:
      description: 返回修改密码的HTML表单页面。若未登录则重定向。
      produces:
      - text/html
      responses:
        "200":
          description: 返回 changepassword.html 页面
          schema:
            type: string
        "302":
          description: 重定向到 /login (未登录时)
          schema:
            type: string
      security:
      - SessionAuth: []
      summary: 修改密码页面 (需登录)
      tags:
      - pages
    post:
      consumes:
      - multipart/form-data
      description: 提交表单以修改当前登录用户的密码
      parameters:
      - description: 原密码
        in: formData
        name: oldpassword
        required: true
        type: string
      - description: 新密码
        in: formData
        name: password
        required: true
        type: string
      - description: 确认新密码
        in: formData
        name: password1
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 密码修改成功
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 请求参数错误（如字段为空或两次输入不一致）
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 未认证，请先登录
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 原密码错误
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 用户不存在
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器内部错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionAuth: []
      summary: 修改用户密码 (需登录)
      tags:
      - users
  /users/profiles:
    get:
      description: 返回修改个人资料的HTML表单页面。若未登录则重定向。
      produces:
      - text/html
      responses:
        "200":
          description: 返回 changeprofiles.html 页面
          schema:
            type: string
        "302":
          description: 重定向到 /api/users/login (未登录时)
          schema:
            type: string
      security:
      - SessionAuth: []
      summary: 修改用户资料页面 (需登录)
      tags:
      - pages
    put:
      consumes:
      - multipart/form-data
      description: 提交表单以修改当前登录用户的用户名或姓名
      parameters:
      - description: 新用户名
        in: formData
        name: newusername
        type: string
      - description: 新姓名
        in: formData
        name: newname
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 用户信息更新成功
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 请求参数错误（如未更改或与原信息相同）
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 未认证，请先登录
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 用户不存在
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器内部错误（如数据库或会话更新失败）
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionAuth: []
      summary: 修改用户资料 (需登录)
      tags:
      - users
securityDefinitions:
  SessionAuth:
    description: 请从登录响应中获取Session Cookie并在此处携带（基于gin-contrib/sessions）
    in: header
    name: Cookie
    type: apiKey
swagger: "2.0"
