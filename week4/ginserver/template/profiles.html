<!DOCTYPE html>
<html>
<head>
    <title>用户资料</title>
</head>
<body>
    <div class="profile-container">
        <h1>用户资料页面</h1>
        <div class="user-info">
            <p><strong>用户名:</strong> {{.username}}</p>
            <p><strong>姓名:</strong> {{.name}}</p>
            <p><strong>密码：</strong>{{.password}}</p>
        </div>
        <button onclick="logout()">退出登录</button>
    </div>
</body>
</html>
