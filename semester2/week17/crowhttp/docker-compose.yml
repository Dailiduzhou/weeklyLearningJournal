services:
  postgres:
    image: postgres:16-alpine
    container_name: crowhttp-postgres
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testdb"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      - appnet

  redis:
    image: redis:7-alpine
    container_name: crowhttp-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      - appnet

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: crowhttp:latest
    container_name: crowhttp-app
    environment:
      REDIS_URL: tcp://redis:6379
      PG_CONN_STR: dbname=testdb user=postgres password=root host=postgres port=5432
    ports:
      - "18080:18080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  pgdata:
    name: crowhttp-pgdata
