apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: micro-svc
  labels:
    app: etcd
spec:
  serviceName: etcd
  replicas: 1
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      containers:
      - name: etcd
        image: quay.io/coreos/etcd:v3.5
        command:
        - etcd
        - --advertise-client-urls=http://etcd-0.etcd:2379
        - --listen-client-urls=http://0.0.0.0:2379
        - --listen-peer-urls=http://0.0.0.0:2380
        - --data-dir=/etcd-data
        ports:
        - containerPort: 2379
          name: client
        - containerPort: 2380
          name: peer
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: etcd-data
          mountPath: /etcd-data
  volumeClaimTemplates:
  - metadata:
      name: etcd-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi

---

apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: micro-svc
  labels:
    app: etcd
spec:
  ports:
  - port: 2379
    name: client
    targetPort: 2379
  - port: 2380
    name: peer
    targetPort: 2380
  selector:
    app: etcd
  clusterIP: None

---

apiVersion: v1
kind: Service
metadata:
  name: etcd-client
  namespace: micro-svc
  labels:
    app: etcd
spec:
  ports:
  - port: 2379
    name: client
    targetPort: 2379
  selector:
    app: etcd
  type: ClusterIP
