Name: gateway
Host: 0.0.0.0
Port: 8888
Upstreams:
  - Name: a-service
    Grpc:
      Etcd:
        Hosts:
          - etcd-client:2379
        Key: a.rpc
    Mappings:
      - Method: GET
        Path: /api/a/call
        RpcPath: pb.A/CallA
  - Name: b-service
    Grpc:
      Etcd:
        Hosts:
          - etcd-client:2379
        Key: b.rpc
    Mappings:
      - Method: GET
        Path: /api/b/pong
        RpcPath: pb.B/Pong
