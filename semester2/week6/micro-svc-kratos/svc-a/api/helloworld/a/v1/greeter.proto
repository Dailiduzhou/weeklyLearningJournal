syntax = "proto3";

package helloworld.a.v1;

import "google/api/annotations.proto";

option go_package = "svc-a/api/helloworld/a/v1;v1";
option java_multiple_files = true;
option java_outer_classname = "HelloworldProtoV1";
option java_package = "dev.kratos.api.helloworld.a.v1";

message PingReq {}
message PingResp {
  string msg = 1;
}

service A {
  rpc Ping(PingReq) returns (PingResp) {
    option (google.api.http) = {get: "/ping"};
  }
}
