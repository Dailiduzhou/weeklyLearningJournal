apiVersion: v1
kind: Namespace
metadata:
  name: user-service
---
apiVersion: v1
kind: Secret
metadata:
  name: user-service-secret
  namespace: user-service
type: Opaque
stringData:
  jwt-access-secret: "your-access-secret-key-at-least-256-bits"
  jwt-refresh-secret: "your-refresh-secret-key-at-least-256-bits"
  db-password: "your-secure-password"
  redis-password: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  namespace: user-service
data:
  user.yaml: |
    Name: user
    Host: 0.0.0.0
    Port: 8888
    
    JwtAuth:
      AccessSecret: "your-access-secret-key-at-least-256-bits"
      AccessExpire: 3600
      RefreshSecret: "your-refresh-secret-key-at-least-256-bits"
      RefreshExpire: 604800
    
    DB:
      DataSource: "postgres://postgres:$(DB_PASSWORD)@postgres:5432/mydb?sslmode=disable"
    
    Cache:
      - Host: redis:6379
        Pass: ""
    
    BizRedis:
      Host: redis:6379
      Pass: ""
      Type: node
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: user-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: user-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8888
        env:
        - name: TZ
          value: "Asia/Shanghai"
        envFrom:
        - secretRef:
            name: user-service-secret
        volumeMounts:
        - name: config
          mountPath: /app/etc
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 8888
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8888
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: config
        configMap:
          name: user-service-config
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: user-service
spec:
  selector:
    app: user-service
  ports:
  - port: 8888
    targetPort: 8888
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: user-service-ingress
  namespace: user-service
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: api.example.com
    http:
      paths:
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 8888
