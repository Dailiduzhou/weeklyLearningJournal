version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: zero-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: user
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - zero-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: zero-redis
    ports:
      - "6379:6379"
    networks:
      - zero-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  etcd:
    image: docker.io/bitnami/etcd:3.5
    container_name: zero-etcd
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    ports:
      - "2379:2379"
    networks:
      - zero-network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: user/Dockerfile
    container_name: zero-user-service
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - zero-network
    restart: unless-stopped

  post-service:
    build:
      context: .
      dockerfile: post/Dockerfile
    container_name: zero-post-service
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
      user-service:
        condition: service_started
    ports:
      - "9001:9001"
    networks:
      - zero-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  zero-network:
    driver: bridge
