Name: gateway-example # gateway name
Host: localhost # gateway host
Port: 8888 # gateway port
Upstreams: # upstreams
  - Name: User
    Grpc: # grpc upstream
      Etcd:
        Hosts:
          - etcd:2379
      Key: user.rpc
    Mappings:
      - Method: POST
        Path: api/user/getpostbyuser
        RpcPath: user.Post/Getpost

  - Name: Post
    Grpc: # grpc upstream
      Etcd:
        Hosts:
          - etcd:2379
      Key: post.rpc
    Mappings:
      - Method: POST
        Path: api/post/getpost
        RpcPath: post.Post/Getpost
