Name: gateway-example
Host: 0.0.0.0
Port: 8888
Upstreams:
  - Name: User
    Grpc:
      Etcd:
        Hosts:
          - etcd:2379
        Key: user.rpc
    ProtoSets:
      - user.proto.protoset
    Mappings:
      - Method: POST
        Path: api/user/getpostbyuser
        RpcPath: user.Post/Getpost

  - Name: Post
    Grpc:
      Etcd:
        Hosts:
          - etcd:2379
        Key: post.rpc
    ProtoSets:
      - post.proto.protoset
    Mappings:
      - Method: POST
        Path: api/post/getpost
        RpcPath: post.Post/Getpost
