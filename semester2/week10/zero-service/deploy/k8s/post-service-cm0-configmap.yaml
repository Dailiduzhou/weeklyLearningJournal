apiVersion: v1
data:
  post.yaml: |
    Name: post.rpc
    ListenOn: 0.0.0.0:9001
    Mode: dev
    Etcd:
      Hosts:
      - etcd:2379
      Key: post.rpc

    BizRedis:
      Host: redis:6379
      Type: node
      Pass: ""

    DB:
      DataSource: root:123456@tcp(mysql:3306)/post?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai
    Cache:
      - Host: redis:6379
        Pass: ""
kind: ConfigMap
metadata:
  labels:
    io.kompose.service: post-service
  name: post-service-cm0
