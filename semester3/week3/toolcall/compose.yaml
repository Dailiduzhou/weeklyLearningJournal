services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?set AGENT_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/00-seed.sql:/docker-entrypoint-initdb.d/00-seed.sql:ro
      - ./docker/postgres/01-readonly.sh:/docker-entrypoint-initdb.d/01-readonly.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
