[package]
name = "rustyloop"
version = "0.1.0"
edition = "2024"

[dependencies]
openai-oxide = { version = "0.15.0", default-features = false, features = ["chat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
mockito = "1"
