<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #4a6fa5; padding-bottom: 15px; }
        .book-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .book-card { 
            border: 1px solid #e0e0e0; 
            border-radius: 8px; 
            padding: 20px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
            transition: transform 0.3s ease;
        }
        .book-card:hover { transform: translateY(-5px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
        .book-title { 
            font-size: 1.4rem; 
            color: #2c3e50; 
            margin: 10px 0; 
            font-weight: 600;
        }
        .book-author { 
            color: #3498db; 
            font-style: italic; 
            margin: 5px 0;
        }
        .book-price { 
            font-weight: bold; 
            color: #e74c3c; 
            font-size: 1.2rem; 
            margin: 8px 0;
        }
        .book-rating { 
            color: #f39c12; 
            margin: 5px 0;
        }
        .metadata { 
            text-align: center; 
            font-size: 0.9rem; 
            color: #7f8c8d; 
            margin-top: 20px; 
            padding-top: 15px; 
            border-top: 1px dashed #bdc3c7;
        }
        .btn-detail {
            display: inline-block;
            background: #3498db;
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 0.9rem;
        }
        .btn-detail:hover { background: #2980b9; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 书籍目录</h1>
            <p>专为 HTML 解析优化的示例页面</p>
        </div>
        
        <div class="book-list" id="book-container">
            {{range .Books}}
            <div class="book-card soup-book-item" data-id="{{.ID}}">
                <h2 class="book-title soup-book-title">{{.Title}}</h2>
                <div class="book-author soup-book-author">作者: {{.Author}}</div>
                <div class="book-price soup-book-price">¥{{.Price}}</div>
                <div class="book-rating soup-book-rating">
                    {{printf "%.1f" .Rating}}/5.0 ⭐
                </div>
                <a href="/book/{{.ID}}" class="btn-detail soup-detail-link">查看详情</a>
            </div>
            {{end}}
        </div>
        
        <div class="metadata soup-metadata">
            <p>生成时间: <span class="soup-gen-time">{{.CurrentTime}}</span></p>
            <p>总书籍数量: <span class="soup-book-count">{{len .Books}}</span> 本</p>
            <p class="soup-parser-hint">提示: 所有关键元素都带有 "soup-" 前缀的 class 名称，便于解析定位</p>
        </div>
    </div>
</body>
</html>
