[package]
name = "mvc_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-session = { version = "0.9", features = ["cookie-session"] }
tera = "1.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bcrypt = "0.15"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "mysql", "chrono", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.10"
log = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
